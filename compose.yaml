services:
  tsukasa-speech:
    build:
      context: .
    image: localhost/tsukasa-speech:latest
    runtime: nvidia
    ports:
      - "7860:7860"
    working_dir: ${PWD}
    volumes:
      - ${PWD}:${PWD}
      - ${HOME}/nltk_data:/home/user/nltk_data
      - ${HOME}/.cache:/home/user/.cache
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request as u,sys; sys.exit(0) if u.urlopen('http://localhost:7860/',timeout=3).status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
